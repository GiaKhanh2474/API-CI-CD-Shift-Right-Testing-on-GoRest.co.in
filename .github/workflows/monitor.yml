name: GoRest Shift-Right Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Check GET /users Response Time (< 900ms)
        run: |
          cat << 'EOF' > monitor_collection.json
          {
            "info": {
              "name": "GoRest Monitor",
              "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
            },
            "item": [
              {
                "name": "GET /users Performance Check",
                "event": [
                  {
                    "listen": "test",
                    "script": {
                      "exec": [
                        "pm.test('Status code is 200 OK', function () {",
                        "    pm.response.to.have.status(200);",
                        "});",
                        "pm.test('Response time is below 800ms', function () {",
                        "    pm.expect(pm.response.responseTime).to.be.below(800);",
                        "});"
                      ],
                      "type": "text/javascript"
                    }
                  }
                ],
                "request": {
                  "method": "GET",
                  "header": [
                    {
                      "key": "Authorization",
                      "value": "Bearer {{token}}",
                      "type": "text"
                    }
                  ],
                  "url": {
                    "raw": "https://gorest.co.in/public/v2/users",
                    "protocol": "https",
                    "host": ["gorest", "co", "in"],
                    "path": ["public", "v2", "users"]
                  }
                }
              }
            ]
          }
          EOF
          newman run monitor_collection.json --env-var "token=${{ secrets.GOREST_TOKEN }}"
