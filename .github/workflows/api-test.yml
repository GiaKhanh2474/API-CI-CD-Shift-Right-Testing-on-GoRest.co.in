name: GoRest API CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman Data-Driven API Tests
        run: |
          newman run 2474802010185_PhamGiaKhanh_GoRest.postman_collection \
            -e 2474802010185_PhamGiaKhanh_GoRest_Env \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
